<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room 1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('page 2.jpg'); /* Ensure 'page 2.jpg' is in same folder */
      background-size: cover;
      background-position: center;
      height: 100vh;
      position: relative;
      font-family: Arial, sans-serif;
      transition: opacity 0.8s ease;
      opacity: 1;
    }

    /* Fade out class to trigger transition */
    .fade-out {
      opacity: 0;
    }

    .start-button, .next-button {
      position: absolute;
      bottom: 100px; /* lower on the screen */
      left: 50%;
      transform: translateX(-50%);
      background-color: #111;
      color: #fff;
      padding: 16px 32px; /* smaller button */
      font-size: 20px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      transition: background-color 0.3s ease, transform 0.3s ease;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 10;
    }

    .start-button:hover,
    .next-button:hover {
      background-color: #222;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
      transform: translateX(-50%) scale(1.1);
    }
  </style>
</head>
<body>
  <button class="next-button" id="nextBtn">Next</button>

  <script>
    const btn = document.getElementById('nextBtn');
    btn.addEventListener('click', () => {
      // Add fade-out class to body
      document.body.classList.add('fade-out');

      // Wait for the transition duration before redirecting
      setTimeout(() => {
        // Redirect to page3.html (change this if needed)
        window.location.href = 'page3.html';
      }, 800); // match duration with CSS transition (0.8s)
    });
  </script>
</body>
</html>
