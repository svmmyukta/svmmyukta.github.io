<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mad Scientist's Chip - Page 5</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: url('lab report table.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Orbitron', monospace, monospace;
    overflow: hidden;
    color: white;
  }

  .clickable-lab-report {
    position: absolute;
    top: 50%;    
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1000px; 
    cursor: pointer;
    z-index: 10;
    transition: transform 0.3s ease;
  }

  .clickable-lab-report:hover {
    transform: translate(-50%, -50%) scale(1.05);
  }

  .overlay-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.7);
    display: none;
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }

  .overlay-popup {
    background-color: rgba(0, 0, 0, 0.95);
    max-width: 900px;
    width: 90%;
    padding: 30px 40px 40px 40px;
    box-sizing: border-box;
    border-radius: 12px;
    text-align: center;
    position: relative;
    color: white;
    font-size: 1.3rem;
    line-height: 1.4;
  }

  .close-btn {
    position: absolute;
    top: 12px;
    right: 15px;
    font-size: 28px;
    font-weight: bold;
    color: white;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .close-btn:hover {
    color: #ff4444;
  }

  .continue-btn {
    margin-top: 30px;
    padding: 24px 48px;
    font-size: 20px;
    font-weight: 700;
    font-family: 'Orbitron', monospace, monospace;
    color: white;
    background-color: black;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    transition: background-color 0.3s ease, transform 0.3s ease;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .continue-btn:hover {
    background-color: #222;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
    transform: scale(1.1);
  }

  .bottom-overlay {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%;
    height: 25vh;
    background-color: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 999;
    text-align: center;
  }

  .typewriter-text {
    font-size: 1.3rem;
    white-space: nowrap;
    overflow: hidden;
    border-right: 3px solid white;
    width: 0;
    animation: typing 4s steps(50, end) forwards, blinkCaret 0.75s step-end infinite;
    max-width: 90%;
    color: white;
    text-align: center;
  }

  @keyframes typing {
    from { width: 0; }
    to { width: 100%; }
  }

  @keyframes blinkCaret {
    0%, 100% { border-color: transparent; }
    50% { border-color: white; }
  }
</style>
</head>
<body>

  <div class="bottom-overlay" id="bottomOverlay">
    <div class="typewriter-text">
      Click on the lab report to investigate further.
    </div>
  </div>

  <img src="lab report cutout.png" alt="Lab Report" class="clickable-lab-report" id="labReportBtn" />

  <div class="overlay-bg" id="caseOverlay">
    <div class="overlay-popup">
      <button class="close-btn" id="closeOverlayBtn" aria-label="Close">&times;</button>
      <div class="overlay-text">
        You’re about to visit three mysterious sites tied to this case. At each site, you’ll discover three hidden clues. Collect them all if you want to unlock the secrets of the chip.
      </div>
      <button class="continue-btn" onclick="goToNextPage()">Continue</button>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('bottomOverlay').style.display = 'none';
      }, 6000);
    });

    const labReportBtn = document.getElementById('labReportBtn');
    const caseOverlay = document.getElementById('caseOverlay');
    const closeOverlayBtn = document.getElementById('closeOverlayBtn');

    labReportBtn.addEventListener('click', () => {
      caseOverlay.style.display = 'flex';
    });

    closeOverlayBtn.addEventListener('click', () => {
      caseOverlay.style.display = 'none';
    });

    function goToNextPage() {
      window.location.href = 'page6.html';
    }
  </script>
</body>
</html>
