<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mad Scientist's Chip - Page 7</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: url('room 2.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', monospace;
      color: white;
      overflow: hidden;
    }

    .bottom-overlay {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      height: 25vh;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .typewriter-text {
      font-size: 1.3rem;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid white;
      width: 0;
      animation: typing 6s steps(80, end) forwards, blinkCaret 0.75s step-end infinite;
      max-width: 90%;
      text-align: center;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blinkCaret {
      0%, 100% { border-color: transparent; }
      50% { border-color: white; }
    }

    .popup-image {
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .popup-image:hover {
      transform: scale(1.1);
    }

    #greenBottle {
      top: 24%;
      left: 28%;
      width: 100px;
    }

    #laptop {
      top: 36%;
      left: 39%;
      width: 100px;
    }

    #robot {
      top: 30%;
      left: 70%;
      width: 200px;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw;
      max-width: 900px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 30px 40px;
      box-sizing: border-box;
      border-radius: 14px;
      z-index: 2000;
      display: none;
      flex-direction: column;
      color: white;
      text-align: center;
    }

    .popup .question {
      font-size: 1.4rem;
      margin-bottom: 20px;
    }

    .popup .options {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
    }

    .popup .options button {
      display: block;
      width: 100%;
      background: transparent;
      border: 2px solid purple;
      color: black;
      font-size: 1.1rem;
      padding: 12px 0;
      margin: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .popup .options button:hover {
      background-color: rgba(128, 0, 128, 0.6);
      color: white;
    }

    .popup .feedback {
      margin-top: 15px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .popup .feedback.correct {
      color: #00ff00;
    }

    .popup .feedback.wrong {
      color: #ff4444;
    }

    .popup .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }

    #nextRoomBtn {
      display: none;
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 20px 35px;
      font-size: 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      z-index: 3000;
      box-shadow: 0 0 20px 4px white;
      animation: pulseGlow 2s infinite;
      transition: transform 0.3s ease;
    }

    #nextRoomBtn:hover {
      background-color: #111;
      transform: scale(1.05);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px white; }
      50% { box-shadow: 0 0 25px white; }
      100% { box-shadow: 0 0 10px white; }
    }
  </style>
</head>
<body>

  <!-- Typewriter Message -->
  <div class="bottom-overlay" id="bottomOverlay">
    <div class="typewriter-text">Uncover more clues to stop the scientist’s chip...</div>
  </div>

  <!-- Interactive Objects -->
  <img src="green bottle.png" alt="Green Bottle" class="popup-image" id="greenBottle" />
  <img src="laptop.png" alt="Laptop" class="popup-image" id="laptop" />
  <img src="robot.png" alt="Robot" class="popup-image" id="robot" />

  <!-- Quiz Pop-Up -->
  <div class="popup" id="popupQuiz">
    <button class="close-btn" id="closePopup">&times;</button>
    <div class="question" id="quizQuestion"></div>
    <div class="options" id="quizOptions"></div>
    <div class="feedback" id="quizFeedback"></div>
  </div>

  <!-- Next Room Button -->
  <button id="nextRoomBtn" onclick="goToNextRoom()">➡ Final Room</button>

  <script>
    const questions = {
      greenBottle: {
        question: "Why is AI-generated misinformation dangerous?",
        options: [
          "a) It can spread false news quickly and confuse people",
          "b) It always gets detected immediately",
          "c) It helps people learn faster"
        ],
        correctIndex: 0
      },
      laptop: {
        question: "How can we prevent the spread of AI-generated misinformation?",
        options: [
          "a) By verifying information from trusted sources",
          "b) By ignoring all online content",
          "c) By sharing everything without checking"
        ],
        correctIndex: 0
      },
      robot: {
        question: "What is one way AI misuse can be regulated?",
        options: [
          "a) Creating laws that require transparency on AI-generated content",
          "b) Banning all AI technology",
          "c) Letting anyone create AI content without rules"
        ],
        correctIndex: 0
      }
    };

    const popupQuiz = document.getElementById('popupQuiz');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizFeedback = document.getElementById('quizFeedback');
    const closePopup = document.getElementById('closePopup');
    const nextRoomBtn = document.getElementById('nextRoomBtn');

    let completed = {
      greenBottle: false,
      laptop: false,
      robot: false
    };

    function checkAllCompleted() {
      if (completed.greenBottle && completed.laptop && completed.robot) {
        nextRoomBtn.style.display = 'block';
      }
    }

    function openPopup(id) {
      const qData = questions[id];
      if (!qData || completed[id]) return;

      quizQuestion.textContent = qData.question;
      quizOptions.innerHTML = '';
      quizFeedback.textContent = '';
      popupQuiz.style.display = 'flex';

      qData.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.textContent = option;
        btn.onclick = () => {
          if (index === qData.correctIndex) {
            quizFeedback.textContent = 'Correct!';
            quizFeedback.className = 'feedback correct';
            completed[id] = true;
            document.getElementById(id).style.boxShadow = "0 0 25px 5px lime";
            setTimeout(() => {
              popupQuiz.style.display = 'none';
              checkAllCompleted();
            }, 1200);
          } else {
            quizFeedback.textContent = 'Wrong!';
            quizFeedback.className = 'feedback wrong';
          }
        };
        quizOptions.appendChild(btn);
      });
    }

    closePopup.addEventListener('click', () => {
      popupQuiz.style.display = 'none';
    });

    document.getElementById('greenBottle').addEventListener('click', () => openPopup('greenBottle'));
    document.getElementById('laptop').addEventListener('click', () => openPopup('laptop'));
    document.getElementById('robot').addEventListener('click', () => openPopup('robot'));

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('bottomOverlay').style.display = 'none';
      }, 5000);
    });

    function goToNextRoom() {
      document.body.style.transition = "opacity 1s ease";
      document.body.style.opacity = "0";
      setTimeout(() => {
        window.location.href = "page8.html"; // ✅ Correct page transition
      }, 1000);
    }
  </script>
</body>
</html>
