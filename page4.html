<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mad Scientist's Chip - Page 4</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: url('page4.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: monospace, monospace;
    color: white;
    overflow: hidden;
  }

  .bottom-overlay {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%;
    height: 25vh;
    background-color: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }

  .typewriter-text {
    font-size: 1.2rem;
    border-right: 3px solid white;
    padding-right: 5px;
    animation: blinkCaret 0.75s step-end infinite;
    max-width: 90%;
    width: 80%;
    text-align: center;
    white-space: normal; /* Allows text to wrap */
    word-break: break-word;
    line-height: 1.5;
  }

  @keyframes blinkCaret {
    0%, 100% { border-color: transparent; }
    50% { border-color: white; }
  }
</style>
</head>
<body>
  <div class="bottom-overlay">
    <div class="typewriter-text" id="typewriter-text"></div>
  </div>

<script>
  const text = "With all the facts in hand, it's time to put your detective instincts to work!";
  const container = document.getElementById('typewriter-text');
  let index = 0;

  function typeWriter() {
    if (index < text.length) {
      container.textContent += text.charAt(index);
      index++;
      setTimeout(typeWriter, 50);
    } else {
      setTimeout(() => {
        container.style.borderRight = "none"; // remove caret after typing ends
        window.location.href = 'page5.html';
      }, 4000);
    }
  }

  window.onload = () => {
    typeWriter();
  }
</script>
</body>
</html>
