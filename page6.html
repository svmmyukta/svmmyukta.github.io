<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mad Scientist's Chip - Page 6</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: url('room 1.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Orbitron', monospace;
      color: white;
      overflow: hidden;
      transition: opacity 1s ease;
    }

    .bottom-overlay {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      height: 25vh;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .typewriter-text {
      font-size: 1.3rem;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid white;
      width: 0;
      animation: typing 6s steps(80, end) forwards, blinkCaret 0.75s step-end infinite;
      max-width: 90%;
      text-align: center;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blinkCaret {
      0%, 100% { border-color: transparent; }
      50% { border-color: white; }
    }

    .popup-image {
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .popup-image:hover {
      transform: scale(1.1);
    }

    #blueBottle {
      top: 35.5%;
      left: 37.5%;
      width: 100px;
    }
    #redBottle {
      top: 61%;
      left: 5%;
      width: 130px;
    }
    #blueBottle2 {
      top: 53%;
      left: 78.5%;
      width: 110px;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70vw;
      max-width: 900px;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 30px 40px;
      box-sizing: border-box;
      border-radius: 14px;
      z-index: 2000;
      display: none;
      flex-direction: column;
      color: white;
      text-align: center;
    }

    .popup .question {
      font-size: 1.4rem;
      margin-bottom: 20px;
    }

    .popup .options {
      background-color: white;
      padding: 20px;
      border-radius: 12px;
    }

    .popup .options button {
      display: block;
      width: 100%;
      background: transparent;
      border: 2px solid purple;
      color: black;
      font-size: 1.1rem;
      font-family: 'Orbitron', monospace;
      padding: 12px 0;
      margin: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .popup .options button:hover {
      background-color: rgba(128, 0, 128, 0.6);
      color: white;
    }

    .popup .feedback {
      margin-top: 15px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .popup .feedback.correct {
      color: #00ff00;
    }

    .popup .feedback.wrong {
      color: #ff4444;
    }

    .popup .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }

    #nextRoomBtn {
      display: none;
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 20px 35px;
      font-size: 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      z-index: 3000;
      box-shadow: 0 0 20px 4px white;
      animation: pulseGlow 2s infinite;
      transition: transform 0.3s ease;
    }

    #nextRoomBtn:hover {
      transform: scale(1.05);
      background-color: #111;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px white; }
      50% { box-shadow: 0 0 25px white; }
      100% { box-shadow: 0 0 10px white; }
    }
  </style>
</head>
<body>

  <!-- Overlay Text -->
  <div class="bottom-overlay" id="bottomOverlay">
    <div class="typewriter-text" id="typewriterText">
      Find the hidden clues to answer the questions
    </div>
  </div>

  <!-- Bottles -->
  <img src="blue bottle.png" alt="Blue Bottle" class="popup-image" id="blueBottle" />
  <img src="red bottle.png" alt="Red Bottle" class="popup-image" id="redBottle" />
  <img src="blue bottle 2.png" alt="Blue Bottle 2" class="popup-image" id="blueBottle2" />

  <!-- Quiz Popup -->
  <div class="popup" id="popupQuiz">
    <button class="close-btn" id="closePopup">&times;</button>
    <div class="question" id="quizQuestion"></div>
    <div class="options" id="quizOptions"></div>
    <div class="feedback" id="quizFeedback"></div>
  </div>

  <!-- Next Room Button -->
  <button id="nextRoomBtn" onclick="goToNextRoom()">➡ Next Room</button>

  <script>
    const questions = {
      blueBottle: {
        question: "How does AI learn from data?",
        options: [
          "a) By memorizing everything exactly",
          "b) By recognizing patterns in large datasets",
          "c) By guessing randomly"
        ],
        correctIndex: 1
      },
      redBottle: {
        question: "What is Generative AI?",
        options: [
          "a) AI that creates new content like images or text",
          "b) AI that only analyzes existing data",
          "c) AI that controls robots"
        ],
        correctIndex: 0
      },
      blueBottle2: {
        question: "What is a major ethical concern regarding AI?",
        options: [
          "a) AI replacing all human jobs immediately",
          "b) AI creating biased or harmful content",
          "c) AI being too slow to process data"
        ],
        correctIndex: 1
      }
    };

    const popupQuiz = document.getElementById('popupQuiz');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizFeedback = document.getElementById('quizFeedback');
    const closePopup = document.getElementById('closePopup');
    const bottomOverlay = document.getElementById('bottomOverlay');
    const nextRoomBtn = document.getElementById('nextRoomBtn');

    let completed = {
      blueBottle: false,
      redBottle: false,
      blueBottle2: false
    };

    function checkAllCompleted() {
      if (completed.blueBottle && completed.redBottle && completed.blueBottle2) {
        nextRoomBtn.style.display = 'block';
      }
    }

    function openPopup(id) {
      const qData = questions[id];
      if (!qData || completed[id]) return;

      quizQuestion.textContent = qData.question;
      quizOptions.innerHTML = '';
      quizFeedback.textContent = '';
      popupQuiz.style.display = 'flex';

      qData.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.textContent = option;
        btn.onclick = () => {
          if (index === qData.correctIndex) {
            quizFeedback.textContent = 'Correct!';
            quizFeedback.className = 'feedback correct';
            completed[id] = true;
            document.getElementById(id).style.boxShadow = "0 0 25px 5px lime";
            setTimeout(() => {
              popupQuiz.style.display = 'none';
              checkAllCompleted();
            }, 1200);
          } else {
            quizFeedback.textContent = 'Wrong!';
            quizFeedback.className = 'feedback wrong';
          }
        };
        quizOptions.appendChild(btn);
      });
    }

    closePopup.addEventListener('click', () => {
      popupQuiz.style.display = 'none';
    });

    document.getElementById('blueBottle').addEventListener('click', () => openPopup('blueBottle'));
    document.getElementById('redBottle').addEventListener('click', () => openPopup('redBottle'));
    document.getElementById('blueBottle2').addEventListener('click', () => openPopup('blueBottle2'));

    window.addEventListener('load', () => {
      setTimeout(() => {
        bottomOverlay.style.display = 'none';
      }, 5000);
    });

    function goToNextRoom() {
      document.body.style.opacity = "0";
      setTimeout(() => {
        window.location.href = "page7.html"; // ✅ Change to your next room page
      }, 1000);
    }
  </script>
</body>
</html>
